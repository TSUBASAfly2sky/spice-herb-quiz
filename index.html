","family":"","part":"種子と葉（どちらも使われる）","origin":"","component":"","feature":"","uses":["はい。カレー粉の成分のひとつとして重要な役割を持つ"],"caution":"","summary":["使用部位：種子と葉（どちらも使われる）","主な使い方：はい。カレー粉の成分のひとつとして重要な役割を持つ"]},{"name":"フェンネル","family":"","part":"葉・茎・種子・根（球根フェンネルは野菜として食べる）","origin":"","component":"アネトール（anethole）","feature":"","uses":[],"caution":"","summary":["使用部位：葉・茎・種子・根（球根フェンネルは野菜として食べる）","主成分：アネトール（anethole）"]},{"name":"ペッパー","family":"コショウ科（Piperaceae）","part":"果実","origin":"インド南西部（マラバール海岸）","component":"ピペリン（piperine）","feature":"","uses":[],"caution":"","summary":["科：コショウ科（Piperaceae）","使用部位：果実","原産・産地：インド南西部（マラバール海岸）","主成分：ピペリン（piperine）"]},{"name":"マジョラム","family":"シソ科（Lamiaceae）","part":"","origin":"","component":"","feature":"","uses":[],"caution":"","summary":["科：シソ科（Lamiaceae）"]},{"name":"マスタード","family":"","part":"種子","origin":"","component":"","feature":"","uses":[],"caution":"","summary":["使用部位：種子"]},{"name":"ミント","family":"","part":"","origin":"","component":"カルボン（carvone）","feature":"","uses":[],"caution":"地下茎で旺盛に広がるため、鉢植えや仕切りが必要","summary":["主成分：カルボン（carvone）","注意：地下茎で旺盛に広がるため、鉢植えや仕切りが必要"]},{"name":"ラベンダー","family":"シソ科（Lamiaceae）","part":"","origin":"","component":"リナロール（linalool）・酢酸リナリル","feature":"","uses":[],"caution":"","summary":["科：シソ科（Lamiaceae）","主成分：リナロール（linalool）・酢酸リナリル"]},{"name":"レモングラス","family":"イネ科（Poaceae）","part":"","origin":"","component":"シトラール（citral）","feature":"","uses":["トムヤムクン・タイカレー"],"caution":"","summary":["科：イネ科（Poaceae）","主成分：シトラール（citral）","主な使い方：トムヤムクン・タイカレー"]},{"name":"ローズマリー","family":"シソ科（Lamiaceae）","part":"","origin":"","component":"シネオール（1,8-シネオール）・カンファー・α-ピネン","feature":"","uses":["ラム肉・豚肉・鶏肉・じゃがいも・トマトなど","イタリア南部・地中海気候の産地で古来より親しまれ、オリーブオイルとの相性が抜群なため"],"caution":"","summary":["科：シソ科（Lamiaceae）","主成分：シネオール（1,8-シネオール）・カンファー・α-ピネン","主な使い方：ラム肉・豚肉・鶏肉・じゃがいも・トマトなど／イタリア南部・地中海気候の産地で古来より親しまれ、オリーブオイルとの相性が抜群なため"]},{"name":"ローリエ","family":"クスノキ科（Lauraceae）","part":"","origin":"","component":"","feature":"","uses":["スープ・シチュー・煮込み料理の香りと風味付け。生葉より乾燥葉の方が香りが穏やか"],"caution":"","summary":["科：クスノキ科（Lauraceae）","主な使い方：スープ・シチュー・煮込み料理の香りと風味付け。生葉より乾燥葉の方が香りが穏やか"]},{"name":"花椒","family":"","part":"","origin":"","component":"","feature":"ホアジャオ・中国山椒（日本の山椒と同じサンショウ属だが別種）","uses":["チリの辛み（辣）と花椒のしびれ（麻）を組み合わせた「麻辣」風味が四川料理の特徴だから"],"caution":"","summary":["特徴：ホアジャオ・中国山椒（日本の山椒と同じサンショウ属だが別種）","主な使い方：チリの辛み（辣）と花椒のしびれ（麻）を組み合わせた「麻辣」風味が四川料理の特徴だから"]}];
let state={mode:"all",chapter:"all",pool:[],current:0,correct:0,wrong:0,answerShown:false};
const LS_WRONG="spice_herb_wrong_ids_v3";
function getWrongIds(){return JSON.parse(localStorage.getItem(LS_WRONG)||"[]")}
function setWrongIds(ids){localStorage.setItem(LS_WRONG,JSON.stringify([...new Set(ids)].sort((a,b)=>a-b)))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function chapters(){return["all",...new Set(ALL_QUESTIONS.map(q=>q.chapter))]}
function getProfile(name){return PROFILES.find(p=>p.name===name)}
function setNav(active){["Quiz","Wrong","Profiles","Export"].forEach(n=>document.getElementById("nav"+n).classList.remove("active"));document.getElementById("nav"+active).classList.add("active")}
function makePool(){let pool=[...ALL_QUESTIONS];if(state.mode==="level2")pool=pool.filter(q=>q.level==="2級追加");if(state.mode==="wrong"){const ids=getWrongIds();pool=pool.filter(q=>ids.includes(q.id))}if(state.chapter!=="all")pool=pool.filter(q=>q.chapter===state.chapter);return shuffle(pool)}
function showQuizHome(){setNav("Quiz");const opts=chapters().map(ch=>`<option value="${escapeHtml(ch)}" ${state.chapter===ch?"selected":""}>${ch==="all"?"全章から出題":escapeHtml(ch)}</option>`).join("");document.getElementById("app").innerHTML=`<div class="tabs"><button class="${state.mode==="all"?"active":""}" onclick="setMode('all')">全問</button><button class="${state.mode==="level2"?"active":""}" onclick="setMode('level2')">2級追加</button><button class="${state.mode==="wrong"?"active":""}" onclick="setMode('wrong')">不正解</button><button onclick="resetAll()">初期化</button></div><div class="filter"><select onchange="setChapter(this.value)">${opts}</select><button onclick="startQuiz()">開始</button></div><div class="progress-wrap"><div class="progress" id="progress"></div></div><section class="card" id="card"><div id="quizArea"></div></section>`;startQuiz()}
function setMode(mode){state.mode=mode;showQuizHome()}
function setChapter(ch){state.chapter=ch;startQuiz()}
function startQuiz(){state.pool=makePool();state.current=0;state.correct=0;state.wrong=0;state.answerShown=false;updateHeader();if(!state.pool.length){showMessage("🌿","問題がありません",state.mode==="wrong"?"不正解リストが空です。全問モードで解いて、苦手問題をためていきましょう。":"この条件では問題が見つかりませんでした。");return}renderQuestion()}
function currentQuestion(){return state.pool[state.current]}
function renderBasic(profile){if(!profile)return "この問題に紐づく基本情報はありません。";return `<b>${escapeHtml(profile.name)}の基本情報</b><br>${profile.summary.map(x=>"・"+escapeHtml(x)).join("<br>")}`}
function renderQuestion(){const q=currentQuestion();const prof=getProfile(q.spice);state.answerShown=false;document.getElementById("quizArea").innerHTML=`<div><div class="meta"><span class="pill">No.${q.id}</span><span class="pill">${escapeHtml(q.level)}</span><span class="pill">${escapeHtml(q.chapter.replace(/（.*?）/g,""))}</span>${q.spice?`<span class="pill">${escapeHtml(q.spice)}</span>`:""}</div><div class="question">${escapeHtml(q.q)}</div><div class="basic-box" id="basicBox">${renderBasic(prof)}</div><div class="hint-box" id="hintBox">${q.hint}</div><div class="answer" id="answerBox">答え：${escapeHtml(q.a)}</div><div class="small-note">基本情報→ヒント→答えの順で見ると、暗記ではなく理解で定着しやすいです。</div></div><div class="buttons"><div class="split"><button class="sub" onclick="showBasic()">基本情報</button><button class="sub" onclick="showHint()">ヒント</button></div><button class="primary" onclick="showAnswer()">答えを見る</button><div class="split"><button class="ok" onclick="markAnswer(true)">正解</button><button class="ng" onclick="markAnswer(false)">不正解</button></div></div>`;updateHeader()}
function showBasic(){const el=document.getElementById("basicBox");if(el)el.style.display="block"}
function showHint(){const el=document.getElementById("hintBox");if(el)el.style.display="block"}
function showAnswer(){const el=document.getElementById("answerBox");if(el)el.style.display="block";state.answerShown=true}
function markAnswer(isCorrect){if(!state.answerShown){const card=document.getElementById("card");if(card){card.classList.add("shake");setTimeout(()=>card.classList.remove("shake"),300)}return}const q=currentQuestion();let wrongIds=getWrongIds();if(isCorrect){state.correct++;wrongIds=wrongIds.filter(id=>id!==q.id)}else{state.wrong++;if(!wrongIds.includes(q.id))wrongIds.push(q.id)}setWrongIds(wrongIds);state.current++;if(state.current>=state.pool.length)finishQuiz();else renderQuestion()}
function finishQuiz(){const rate=state.pool.length?Math.round(state.correct/state.pool.length*100):0;showMessage("🎉","終了！",`正解：${state.correct}問<br>不正解：${state.wrong}問<br>正答率：${rate}%<br><br>${rate>=80?"合格ライン到達。ええ香りしてます。":"80%まであと少し。苦手だけ追いスパイスしましょう。"}`);updateHeader(true)}
function showMessage(icon,title,text){const area=document.getElementById("quizArea");if(!area)return;area.innerHTML=`<div class="finish"><div class="finish-icon">${icon}</div><div class="finish-title">${title}</div><div class="finish-text">${text}</div></div><div class="buttons"><button class="primary" onclick="startQuiz()">もう一度</button><button class="sub" onclick="showWrongList()">不正解リストを見る</button></div>`;const p=document.getElementById("progress");if(p)p.style.width="100%"}
function updateHeader(done=false){const total=state.pool.length||0;document.getElementById("now").textContent=total?Math.min(state.current+1,total):0;document.getElementById("total").textContent=total||ALL_QUESTIONS.length;document.getElementById("correct").textContent=state.correct;document.getElementById("wrong").textContent=state.wrong;const p=document.getElementById("progress");if(p)p.style.width=total?(done?100:state.current/total*100)+"%":"0%"}
function showWrongList(){setNav("Wrong");const wrongIds=getWrongIds();const list=ALL_QUESTIONS.filter(q=>wrongIds.includes(q.id));document.getElementById("total").textContent=list.length;const items=list.length?list.map(q=>`<div class="list-item"><div class="meta"><span class="pill">No.${q.id}</span><span class="pill">${escapeHtml(q.chapter.replace(/（.*?）/g,""))}</span>${q.spice?`<span class="pill">${escapeHtml(q.spice)}</span>`:""}</div><div class="li-q">${escapeHtml(q.q)}</div><div class="li-a">答え：${escapeHtml(q.a)}</div><div class="mini-actions"><button class="sub" onclick="removeWrong(${q.id})">削除</button><button class="primary" onclick="singleQuiz(${q.id})">この問題を解く</button></div></div>`).join(""):`<div class="card"><div class="finish"><div class="finish-icon">🌿</div><div class="finish-title">不正解なし</div><div class="finish-text">苦手リストは空です。</div></div></div>`;document.getElementById("app").innerHTML=`<div class="tabs"><button class="active">不正解 ${list.length}</button><button onclick="startWrongQuiz()">復習開始</button><button onclick="showExport()">抜粋</button><button onclick="clearWrong()">全削除</button></div><div class="list">${items}</div>`}
function removeWrong(id){setWrongIds(getWrongIds().filter(x=>x!==id));showWrongList()}
function clearWrong(){if(confirm("不正解リストをすべて削除しますか？")){setWrongIds([]);showWrongList()}}
function startWrongQuiz(){state.mode="wrong";state.chapter="all";showQuizHome()}
function singleQuiz(id){const q=ALL_QUESTIONS.find(x=>x.id===id);if(!q)return;setNav("Quiz");state.pool=[q];state.current=0;state.correct=0;state.wrong=0;document.getElementById("app").innerHTML=`<div class="tabs"><button onclick="showQuizHome()">全問へ</button><button class="active">単問</button><button onclick="showWrongList()">戻る</button><button onclick="removeWrong(${id})">削除</button></div><div class="progress-wrap"><div class="progress" id="progress"></div></div><section class="card" id="card"><div id="quizArea"></div></section>`;renderQuestion()}
function showProfiles(filter=""){setNav("Profiles");const f=filter.trim();const list=PROFILES.filter(p=>!f||p.name.includes(f)||p.summary.join(" ").includes(f));document.getElementById("total").textContent=PROFILES.length;document.getElementById("app").innerHTML=`<input class="search" placeholder="スパイス名・成分・部位で検索" value="${escapeHtml(f)}" oninput="showProfiles(this.value)"><div class="list">${list.map(p=>`<div class="list-item"><div class="profile-title">${escapeHtml(p.name)}</div>${p.summary.map(x=>`<div class="profile-line">${escapeHtml(x)}</div>`).join("")}</div>`).join("")}</div>`}
function showExport(){setNav("Export");const wrongIds=getWrongIds();const list=ALL_QUESTIONS.filter(q=>wrongIds.includes(q.id));const text=list.map(q=>`No.${q.id} ${q.chapter}\nQ. ${q.q}\nA. ${q.a}${q.spice?"\n基本情報. "+(getProfile(q.spice)?.summary||[]).join(" / "):""}`).join("\n\n");document.getElementById("total").textContent=list.length;document.getElementById("app").innerHTML=`<div class="card"><div><div class="meta"><span class="pill">不正解抜粋</span><span class="pill">${list.length}問</span></div><div class="question" style="font-size:20px;">不正解だった問題だけをテキスト化</div><div class="small-note">コピーしてメモ帳・LINE・Notionなどに貼れます。</div><textarea id="exportText">${escapeHtml(text||"不正解リストは空です。")}</textarea></div><div class="buttons"><button class="primary" onclick="copyExport()">コピーする</button><button class="sub" onclick="showWrongList()">不正解リストへ</button></div></div>`}
async function copyExport(){const t=document.getElementById("exportText");t.select();try{await navigator.clipboard.writeText(t.value);alert("コピーしました！")}catch(e){document.execCommand("copy");alert("コピーしました！")}}
function resetAll(){if(confirm("学習状態と不正解リストを初期化しますか？")){localStorage.removeItem(LS_WRONG);state.mode="all";state.chapter="all";showQuizHome()}}
showQuizHome();
</script>

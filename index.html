<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6B3410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="スパイス検定" />
  <title>スパイス＆ハーブ検定 一問一答</title>
  <style>
:root {
  --bg: #fef8f0;
  --bg2: #f5ebe0;
  --main: #6B3410;
  --main2: #9c4e1a;
  --accent: #D4882A;
  --accent2: #f0a83c;
  --green: #2d8a44;
  --green-bg: #e8f5ec;
  --red: #c0392b;
  --red-bg: #fdecea;
  --text: #2c1a0e;
  --muted: #8a7060;
  --card: #ffffff;
  --line: #e8d5bf;
  --shadow: 0 8px 32px rgba(80,40,10,.14);
  --shadow-sm: 0 2px 12px rgba(80,40,10,.10);
  --radius: 20px;
  --radius-lg: 28px;
  --trans: .22s cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  background: var(--bg2);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.app-wrap {
  width: 100%;
  max-width: 440px;
  min-height: 100svh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 40px rgba(0,0,0,.12);
}

/* ===== HEADER ===== */
.app-header {
  background: linear-gradient(135deg, #5a2b0d 0%, #9c4e1a 60%, #c4721a 100%);
  color: #fff;
  padding: calc(env(safe-area-inset-top) + 14px) 18px 16px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.app-header::after {
  content: "🌿";
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%) rotate(-15deg);
  font-size: 72px;
  opacity: .1;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.app-title { font-size: 15px; font-weight: 800; letter-spacing: .04em; opacity: .9; }
.header-streak {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.18);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px; font-weight: 800;
}
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.stat-box {
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 14px;
  padding: 8px 6px;
  text-align: center;
  backdrop-filter: blur(6px);
}
.stat-box b { display: block; font-size: 18px; font-weight: 900; line-height: 1.2; }
.stat-box span { font-size: 10px; opacity: .82; margin-top: 2px; display: block; }

/* ===== MAIN CONTENT ===== */
.app-main {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 72px);
  -webkit-overflow-scrolling: touch;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 440px;
  background: rgba(255,252,248,.96);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
  backdrop-filter: blur(12px);
  z-index: 100;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 10px 4px 8px;
  border: 0; background: transparent;
  color: var(--muted);
  font-size: 10px; font-weight: 700;
  gap: 3px;
  cursor: pointer;
  transition: color var(--trans);
  position: relative;
}
.nav-btn .nav-icon { font-size: 20px; line-height: 1; transition: transform var(--trans); }
.nav-btn.active { color: var(--main); }
.nav-btn.active .nav-icon { transform: scale(1.15); }
.nav-btn .badge {
  position: absolute;
  top: 6px; right: calc(50% - 16px);
  background: var(--red);
  color: white;
  border-radius: 999px;
  font-size: 9px; font-weight: 900;
  min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 3px;
}

/* ===== CARDS / SECTIONS ===== */
.section-title {
  font-size: 13px; font-weight: 800;
  color: var(--muted);
  letter-spacing: .06em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 20px 18px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.card-deco {
  position: absolute;
  right: -8px; top: -12px;
  font-size: 72px;
  opacity: .06;
  transform: rotate(-12deg);
}

/* ===== HOME SCREEN ===== */
.home-today {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.today-box {
  background: linear-gradient(135deg, var(--main), var(--main2));
  color: white;
  border-radius: var(--radius);
  padding: 16px;
}
.today-box.green { background: linear-gradient(135deg, #267035, var(--green)); }
.today-box .tb-label { font-size: 11px; opacity: .85; margin-bottom: 6px; }
.today-box .tb-value { font-size: 28px; font-weight: 900; }
.today-box .tb-unit { font-size: 13px; opacity: .8; }

.chapter-progress-list { display: flex; flex-direction: column; gap: 10px; }
.chapter-row { }
.chapter-row-top {
  display: flex; justify-content: space-between;
  font-size: 12px; font-weight: 700; margin-bottom: 5px;
}
.chapter-row-top .ch-name { color: var(--text); max-width: 75%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-row-top .ch-pct { color: var(--muted); }
.ch-bar-wrap { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
.ch-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--main)); transition: width .5s ease; }

.start-btn {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #5a2b0d, #9c4e1a);
  color: white;
  font-size: 16px; font-weight: 900;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform var(--trans), box-shadow var(--trans);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.start-btn:active { transform: scale(.97); box-shadow: var(--shadow-sm); }

.recent-history-list { display: flex; flex-direction: column; gap: 8px; }
.history-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--bg);
  border-radius: 14px;
}
.hi-badge {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.hi-badge.ok { background: var(--green-bg); }
.hi-badge.ng { background: var(--red-bg); }
.hi-body { flex: 1; min-width: 0; }
.hi-q { font-size: 12px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hi-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.hi-time { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ===== QUIZ SCREEN ===== */
.quiz-controls {
  display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-bottom: 12px;
}
.mode-btn {
  border: 0; border-radius: 12px;
  padding: 10px 6px;
  font-size: 12px; font-weight: 800;
  background: var(--line);
  color: var(--main);
  cursor: pointer;
  transition: background var(--trans), color var(--trans);
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.mode-btn.active { background: var(--main); color: white; }
.mode-btn .mode-count {
  font-size: 10px;
  background: rgba(255,255,255,.3);
  border-radius: 999px;
  padding: 1px 5px;
}

.filter-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px; }
select {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 13px; font-weight: 700;
  background: white;
  color: var(--text);
  appearance: none;
  cursor: pointer;
}

.prog-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.prog-bar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--main)); border-radius: 999px; transition: width .25s ease; }
.prog-text { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }

/* Quiz Card */
.quiz-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 22px 20px 18px;
  min-height: 340px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform .15s ease;
}
.quiz-card.shake { animation: shake .3s ease; }
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.quiz-card::before {
  content: "🌿";
  position: absolute; right: -10px; top: -15px;
  font-size: 80px; opacity: .07; transform: rotate(-12deg);
  pointer-events: none;
}

.q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pill {
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px; font-weight: 800;
  background: #fff3d8;
  color: var(--main);
  display: inline-flex; align-items: center; gap: 4px;
}
.pill.new { background: #e8f5ec; color: var(--green); }
.pill.stale { background: var(--red-bg); color: var(--red); }

.q-text {
  font-size: 21px; font-weight: 900; line-height: 1.55;
  letter-spacing: .02em;
  flex: 1;
  white-space: pre-wrap;
}
.reveal-box {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 16px;
  font-size: 14px; line-height: 1.6;
  display: none;
}
.reveal-box.basic { background: #fff8e6; border-left: 3px solid var(--accent); }
.reveal-box.hint { background: #f0f0ff; border-left: 3px solid #7b68ee; }
.reveal-box.answer { background: var(--green-bg); border-left: 3px solid var(--green); font-size: 16px; font-weight: 800; }
.reveal-box.shown { display: block; animation: fadeSlideIn .2s ease; }
@keyframes fadeSlideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

.small-note { font-size: 11px; color: var(--muted); margin-top: 12px; text-align: center; }

/* Buttons */
.btn-group { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  border: 0; border-radius: 16px;
  padding: 13px 16px;
  font-size: 14px; font-weight: 800;
  cursor: pointer;
  transition: transform var(--trans), box-shadow var(--trans), opacity var(--trans);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: linear-gradient(135deg, #5a2b0d, var(--main2)); color: white; box-shadow: 0 4px 16px rgba(107,52,16,.35); }
.btn-sub { background: var(--line); color: var(--main); }
.btn-ok { background: linear-gradient(135deg, #267035, var(--green)); color: white; box-shadow: 0 4px 14px rgba(45,138,68,.3); }
.btn-ng { background: linear-gradient(135deg, var(--red), #e74c3c); color: white; box-shadow: 0 4px 14px rgba(192,57,43,.3); }
.btn-disabled { opacity: .4; pointer-events: none; }

/* ===== WRONG LIST ===== */
.list-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.lc-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.lc-q { font-size: 14px; font-weight: 700; line-height: 1.5; margin-bottom: 6px; color: var(--text); }
.lc-a { font-size: 13px; color: var(--green); font-weight: 700; padding: 8px 12px; background: var(--green-bg); border-radius: 10px; margin-bottom: 8px; }
.lc-stat { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.lc-actions { display: flex; gap: 8px; }
.lc-actions button { flex: 1; }

/* ===== PROFILES ===== */
.search-input {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 14px; font-weight: 600;
  background: white;
  margin-bottom: 12px;
  outline: none;
}
.search-input:focus { border-color: var(--main); }
.profile-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.profile-name { font-size: 16px; font-weight: 900; color: var(--main); margin-bottom: 8px; }
.profile-line { font-size: 13px; color: var(--text); line-height: 1.7; padding: 3px 0; border-bottom: 1px solid var(--line); }
.profile-line:last-child { border-bottom: 0; }

/* ===== HISTORY / STATS ===== */
.stat-section { margin-bottom: 18px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 14px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}
.stat-item .si-val { font-size: 28px; font-weight: 900; color: var(--main); }
.stat-item .si-label { font-size: 11px; color: var(--muted); margin-top: 3px; }

.history-entry {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: 12px;
}
.he-icon { font-size: 22px; flex-shrink: 0; }
.he-body { flex: 1; min-width: 0; }
.he-session { font-size: 13px; font-weight: 800; color: var(--text); }
.he-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
.he-score { font-size: 16px; font-weight: 900; }
.he-score.good { color: var(--green); }
.he-score.bad { color: var(--red); }

/* ===== FINISH ===== */
.finish-view { text-align: center; padding: 24px 0 16px; }
.finish-icon { font-size: 56px; margin-bottom: 10px; }
.finish-title { font-size: 24px; font-weight: 900; color: var(--main); margin-bottom: 8px; }
.finish-rate {
  font-size: 52px; font-weight: 900;
  margin: 10px 0;
}
.finish-rate.great { color: var(--green); }
.finish-rate.ok { color: var(--accent); }
.finish-rate.ng { color: var(--red); }
.finish-detail { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.finish-msg { font-size: 14px; color: var(--text); background: var(--bg); border-radius: 14px; padding: 12px 16px; margin: 14px 0; }

/* ===== EMPTY STATE ===== */
.empty {
  text-align: center; padding: 40px 20px;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.empty-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }

/* ===== EXPORT ===== */
textarea {
  width: 100%;
  height: 220px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
  margin-top: 12px;
  background: var(--bg);
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 80px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30,15,5,.88);
  color: white;
  border-radius: 999px;
  padding: 10px 20px;
  font-size: 13px; font-weight: 700;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  </style>
</head>
<body>
<div class="app-wrap">
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-top">
      <div class="app-title">🌿 スパイス＆ハーブ検定</div>
      <div class="header-streak" id="streakDisplay">🔥 0日連続</div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><b id="hdrCurrent">0</b><span>現在</span></div>
      <div class="stat-box"><b id="hdrTotal">1383</b><span>出題数</span></div>
      <div class="stat-box"><b id="hdrCorrect">0</b><span>正解</span></div>
      <div class="stat-box"><b id="hdrWrong">0</b><span>不正解</span></div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-main" id="appMain"></main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome" onclick="showHome()">
      <span class="nav-icon">🏠</span>ホーム
    </button>
    <button class="nav-btn" id="navQuiz" onclick="showQuizHome()">
      <span class="nav-icon">📝</span>問題
    </button>
    <button class="nav-btn" id="navWrong" onclick="showWrongList()">
      <span class="nav-icon">❌</span>不正解
      <span class="badge" id="wrongBadge" style="display:none"></span>
    </button>
    <button class="nav-btn" id="navProfiles" onclick="showProfiles()">
      <span class="nav-icon">📖</span>図鑑
    </button>
    <button class="nav-btn" id="navStats" onclick="showStats()">
      <span class="nav-icon">📊</span>記録
    </button>
  </nav>
</div>

// ===== STORAGE KEYS =====
const LS_WRONG    = "spice_v2_wrong";
const LS_HISTORY  = "spice_v2_history"; // { id: {c:correct, w:wrong, last:ISO, first:ISO} }
const LS_SESSIONS = "spice_v2_sessions"; // [{date,correct,wrong,total,mode,chapter}]
const LS_STREAK   = "spice_v2_streak";  // {last:ISO_DATE, count:n}

// ===== STATE =====
let state = {
  screen: "home",
  mode: "all",
  chapter: "all",
  pool: [],
  current: 0,
  correct: 0,
  wrong: 0,
  answerShown: false,
  sessionStart: null
};

// ===== STORAGE UTILS =====
const getWrongIds   = () => JSON.parse(localStorage.getItem(LS_WRONG) || "[]");
const setWrongIds   = ids => localStorage.setItem(LS_WRONG, JSON.stringify([...new Set(ids)].sort((a,b)=>a-b)));
const getHistory    = () => JSON.parse(localStorage.getItem(LS_HISTORY) || "{}");
const getSessions   = () => JSON.parse(localStorage.getItem(LS_SESSIONS) || "[]");
const getStreakData  = () => JSON.parse(localStorage.getItem(LS_STREAK) || '{"last":null,"count":0}');

function updateHistory(id, isCorrect) {
  const h = getHistory();
  if (!h[id]) h[id] = { c: 0, w: 0, last: null, first: null };
  const now = new Date().toISOString();
  if (!h[id].first) h[id].first = now;
  h[id].last = now;
  if (isCorrect) h[id].c++;
  else h[id].w++;
  localStorage.setItem(LS_HISTORY, JSON.stringify(h));
}

function saveSession(correct, wrong, total, mode, chapter) {
  const sessions = getSessions();
  sessions.unshift({
    date: new Date().toISOString(),
    correct, wrong, total, mode, chapter
  });
  if (sessions.length > 100) sessions.pop();
  localStorage.setItem(LS_SESSIONS, JSON.stringify(sessions));
}

function updateStreak() {
  const streak = getStreakData();
  const today  = new Date().toISOString().slice(0, 10);
  if (streak.last === today) return streak.count;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const newCount  = streak.last === yesterday ? streak.count + 1 : 1;
  localStorage.setItem(LS_STREAK, JSON.stringify({ last: today, count: newCount }));
  return newCount;
}

function getStreak() { return getStreakData().count; }

// ===== HELPERS =====
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function esc(str) {
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}
function chapters() {
  return ["all", ...new Set(ALL_QUESTIONS.map(q => q.chapter))];
}
function getProfile(name) {
  return PROFILES.find(p => p.name === name);
}
function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtDateShort(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const today = new Date();
  const diff = Math.floor((today - d) / 86400000);
  if (diff === 0) return "今日";
  if (diff === 1) return "昨日";
  return `${diff}日前`;
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// ===== NAV =====
function setNav(name) {
  ["Home","Quiz","Wrong","Profiles","Stats"].forEach(n => {
    document.getElementById("nav"+n).classList.remove("active");
  });
  document.getElementById("nav"+name).classList.add("active");
  updateWrongBadge();
}
function updateWrongBadge() {
  const ids = getWrongIds();
  const badge = document.getElementById("wrongBadge");
  if (ids.length > 0) {
    badge.style.display = "flex";
    badge.textContent = ids.length > 99 ? "99+" : ids.length;
  } else {
    badge.style.display = "none";
  }
}

function updateHeader(overrideCurrent, overrideTotal) {
  const total = overrideTotal !== undefined ? overrideTotal : (state.pool.length || ALL_QUESTIONS.length);
  document.getElementById("hdrCurrent").textContent = overrideCurrent !== undefined
    ? overrideCurrent
    : (total ? Math.min(state.current + 1, total) : 0);
  document.getElementById("hdrTotal").textContent   = total;
  document.getElementById("hdrCorrect").textContent  = state.correct;
  document.getElementById("hdrWrong").textContent    = state.wrong;
  document.getElementById("streakDisplay").textContent = `🔥 ${getStreak()}日連続`;
}

// ===== HOME SCREEN =====
function showHome() {
  setNav("Home");
  updateHeader(0, ALL_QUESTIONS.length);
  const h = getHistory();
  const today = new Date().toISOString().slice(0, 10);
  const answeredIds = Object.keys(h);
  const todayIds = answeredIds.filter(id => h[id].last && h[id].last.slice(0,10) === today);
  const totalAnswered = answeredIds.length;
  const totalCorrect  = answeredIds.reduce((s, id) => s + h[id].c, 0);
  const totalAttempts = answeredIds.reduce((s, id) => s + h[id].c + h[id].w, 0);
  const overallRate   = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;

  // 章別進捗
  const chapterMap = {};
  ALL_QUESTIONS.forEach(q => {
    if (!chapterMap[q.chapter]) chapterMap[q.chapter] = { total: 0, answered: 0 };
    chapterMap[q.chapter].total++;
    if (h[q.id]) chapterMap[q.chapter].answered++;
  });
  const chapterRows = Object.entries(chapterMap).map(([ch, data]) => {
    const pct = Math.round(data.answered / data.total * 100);
    const shortName = ch.replace(/（.*?）/g, "").replace("第", "").trim();
    return `<div class="chapter-row">
      <div class="chapter-row-top">
        <span class="ch-name">${esc(shortName)}</span>
        <span class="ch-pct">${data.answered}/${data.total} (${pct}%)</span>
      </div>
      <div class="ch-bar-wrap"><div class="ch-bar" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");

  // 最近の履歴
  const sessions = getSessions();
  const recentHTML = sessions.slice(0, 5).map(s => {
    const rate = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const d = new Date(s.date);
    const label = s.mode === "wrong" ? "不正解復習" : s.chapter === "all" ? "全問" : s.chapter.replace(/（.*?）/g,"");
    return `<div class="history-entry">
      <div class="he-icon">${rate >= 80 ? "🌟" : rate >= 60 ? "📖" : "💪"}</div>
      <div class="he-body">
        <div class="he-session">${esc(label)}</div>
        <div class="he-detail">${s.correct}正解 / ${s.wrong}不正解 · ${fmtDateShort(s.date)}</div>
      </div>
      <div class="he-score ${rate >= 80 ? 'good' : rate >= 60 ? '' : 'bad'}">${rate}%</div>
    </div>`;
  }).join("") || `<div class="empty"><div class="empty-icon">📖</div><div class="empty-desc">まだ学習記録がありません</div></div>`;

  document.getElementById("appMain").innerHTML = `
    <div class="home-today">
      <div class="today-box">
        <div class="tb-label">今日の学習</div>
        <div class="tb-value">${todayIds.length}<span class="tb-unit"> 問</span></div>
      </div>
      <div class="today-box green">
        <div class="tb-label">総合正解率</div>
        <div class="tb-value">${overallRate}<span class="tb-unit"> %</span></div>
      </div>
    </div>

    <button class="start-btn" onclick="showQuizHome()">
      ▶ 問題を始める (${ALL_QUESTIONS.length}問)
    </button>

    <div style="margin-top:18px">
      <div class="section-title">📚 章別進捗 (${totalAnswered}/${ALL_QUESTIONS.length}問)</div>
      <div class="card">
        <div class="chapter-progress-list">${chapterRows}</div>
      </div>
    </div>

    <div style="margin-top:4px">
      <div class="section-title">🕐 最近の学習</div>
      ${recentHTML}
    </div>
  `;
}

// ===== QUIZ SCREEN =====
function makePool() {
  let pool = [...ALL_QUESTIONS];
  if (state.mode === "level2") pool = pool.filter(q => q.level === "2級追加");
  if (state.mode === "wrong") {
    const ids = getWrongIds();
    pool = pool.filter(q => ids.includes(q.id));
  }
  if (state.chapter !== "all") pool = pool.filter(q => q.chapter === state.chapter);

  // 未回答・苦手を優先するスマートシャッフル
  const h = getHistory();
  if (state.mode === "all" || state.mode === "level2") {
    pool.sort((a, b) => {
      const ha = h[a.id], hb = h[b.id];
      if (!ha && !hb) return 0;
      if (!ha) return -1;
      if (!hb) return 1;
      // 正解率が低いもの優先
      const rateA = ha.c / (ha.c + ha.w);
      const rateB = hb.c / (hb.c + hb.w);
      return rateA - rateB;
    });
    // 上位30%の中でシャッフル (多様性を保つ)
    const cutoff = Math.max(20, Math.floor(pool.length * 0.3));
    const top = pool.slice(0, cutoff);
    const rest = pool.slice(cutoff);
    return [...shuffle(top), ...shuffle(rest)];
  }
  return shuffle(pool);
}

function showQuizHome() {
  setNav("Quiz");
  const wrongCount   = getWrongIds().length;
  const chapterOpts  = chapters().map(ch =>
    `<option value="${esc(ch)}" ${state.chapter === ch ? "selected" : ""}>${ch === "all" ? "全章から出題" : esc(ch)}</option>`
  ).join("");
  const level2Count  = ALL_QUESTIONS.filter(q => q.level === "2級追加").length;

  document.getElementById("appMain").innerHTML = `
    <div class="mode-tabs">
      <button class="mode-btn ${state.mode === 'all' ? 'active' : ''}" onclick="setMode('all')">
        全問 <span class="mode-count">${ALL_QUESTIONS.length}</span>
      </button>
      <button class="mode-btn ${state.mode === 'level2' ? 'active' : ''}" onclick="setMode('level2')">
        2級追加 <span class="mode-count">${level2Count}</span>
      </button>
      <button class="mode-btn ${state.mode === 'wrong' ? 'active' : ''}" onclick="setMode('wrong')">
        不正解 <span class="mode-count">${wrongCount}</span>
      </button>
    </div>
    <div class="filter-row">
      <select onchange="setChapter(this.value)">${chapterOpts}</select>
      <button class="btn btn-primary" onclick="startQuiz()" style="white-space:nowrap;border-radius:12px;padding:11px 18px;font-size:13px;">▶ 開始</button>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-text" id="progText">-</div>
    </div>
    <div id="quizCardArea"></div>
  `;
  startQuiz();
}

function setMode(mode) { state.mode = mode; showQuizHome(); }
function setChapter(ch) { state.chapter = ch; startQuiz(); }

function startQuiz() {
  state.pool        = makePool();
  state.current     = 0;
  state.correct     = 0;
  state.wrong       = 0;
  state.answerShown = false;
  state.sessionStart = new Date();
  updateHeader();
  if (!state.pool.length) {
    showQuizMessage("🌿", "問題がありません",
      state.mode === "wrong"
        ? "不正解リストが空です。全問モードで解いて苦手をためましょう。"
        : "この条件では問題が見つかりません。");
    return;
  }
  renderQuestion();
}

function currentQ() { return state.pool[state.current]; }

function renderQuestion() {
  const q    = currentQ();
  const h    = getHistory();
  const qh   = h[q.id];
  const prof = getProfile(q.spice);
  state.answerShown = false;
  updateHeader();
  updateProgress();

  const attempts = qh ? qh.c + qh.w : 0;
  const rate     = qh && attempts ? Math.round(qh.c / attempts * 100) : null;
  const histPill = qh
    ? `<span class="pill ${rate >= 80 ? 'new' : 'stale'}">過去${attempts}回 ${rate}%正解</span>`
    : `<span class="pill new">初挑戦 ✨</span>`;

  const basicContent = prof
    ? `<b>${esc(prof.name)}の基本情報</b><br>${prof.summary.map(x => "・" + esc(x)).join("<br>")}`
    : "基本情報なし";

  document.getElementById("quizCardArea").innerHTML = `
    <div class="quiz-card" id="quizCard">
      <div>
        <div class="q-meta">
          <span class="pill">No.${q.id}</span>
          <span class="pill">${esc(q.level)}</span>
          <span class="pill">${esc(q.chapter.replace(/（.*?）/g,""))}</span>
          ${q.spice ? `<span class="pill">${esc(q.spice)}</span>` : ""}
          ${histPill}
        </div>
        <div class="q-text">${esc(q.q)}</div>
        <div class="reveal-box basic" id="boxBasic">${basicContent}</div>
        <div class="reveal-box hint" id="boxHint">💡 ${q.hint || "ヒントなし"}</div>
        <div class="reveal-box answer" id="boxAnswer">✅ 答え：${esc(q.a)}</div>
        <div class="small-note">基本情報→ヒント→答えの順で見ると定着しやすいです</div>
      </div>
      <div class="btn-group">
        <div class="btn-row">
          <button class="btn btn-sub" onclick="revealBox('boxBasic')">📚 基本情報</button>
          <button class="btn btn-sub" onclick="revealBox('boxHint')">💡 ヒント</button>
        </div>
        <button class="btn btn-primary" onclick="showAnswer()">答えを見る</button>
        <div class="btn-row">
          <button class="btn btn-ok" id="btnOk" onclick="markAnswer(true)">⭕ 正解</button>
          <button class="btn btn-ng" id="btnNg" onclick="markAnswer(false)">❌ 不正解</button>
        </div>
      </div>
    </div>
  `;
}

function revealBox(id) {
  document.getElementById(id)?.classList.add("shown");
}
function showAnswer() {
  revealBox("boxAnswer");
  state.answerShown = true;
}
function updateProgress() {
  const total = state.pool.length;
  const pct   = total ? state.current / total * 100 : 0;
  const fill  = document.getElementById("progFill");
  const text  = document.getElementById("progText");
  if (fill) fill.style.width = pct + "%";
  if (text) text.textContent = total ? `${state.current + 1} / ${total}` : "-";
}

function markAnswer(isCorrect) {
  if (!state.answerShown) {
    document.getElementById("quizCard")?.classList.add("shake");
    setTimeout(() => document.getElementById("quizCard")?.classList.remove("shake"), 300);
    showToast("まず答えを確認してください");
    return;
  }
  const q = currentQ();
  let wrongIds = getWrongIds();
  if (isCorrect) {
    state.correct++;
    wrongIds = wrongIds.filter(id => id !== q.id);
    showToast("⭕ 正解！");
  } else {
    state.wrong++;
    if (!wrongIds.includes(q.id)) wrongIds.push(q.id);
    showToast("❌ 不正解…");
  }
  setWrongIds(wrongIds);
  updateHistory(q.id, isCorrect);
  updateStreak();
  state.current++;
  if (state.current >= state.pool.length) finishQuiz();
  else renderQuestion();
}

function finishQuiz() {
  const total = state.pool.length;
  const rate  = total ? Math.round(state.correct / total * 100) : 0;
  saveSession(state.correct, state.wrong, total, state.mode, state.chapter);
  updateHeader(total, total);
  const progFill = document.getElementById("progFill");
  const progText = document.getElementById("progText");
  if (progFill) progFill.style.width = "100%";
  if (progText) progText.textContent = `${total} / ${total}`;

  const rateClass = rate >= 80 ? "great" : rate >= 60 ? "ok" : "ng";
  const msg = rate >= 80
    ? "🌟 合格ライン到達！香り高い結果です。"
    : rate >= 60
    ? "📖 もう少し！苦手問題を復習しましょう。"
    : "💪 基本から丁寧に。不正解リストで復習を！";

  document.getElementById("quizCardArea").innerHTML = `
    <div class="quiz-card">
      <div class="finish-view">
        <div class="finish-icon">${rate >= 80 ? "🎉" : "📖"}</div>
        <div class="finish-title">セッション終了！</div>
        <div class="finish-rate ${rateClass}">${rate}%</div>
        <div class="finish-detail">正解 ${state.correct}問 / 不正解 ${state.wrong}問 (計${total}問)</div>
        <div class="finish-msg">${msg}</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">🔄 もう一度</button>
        <div class="btn-row">
          <button class="btn btn-sub" onclick="showWrongList()">❌ 不正解リスト</button>
          <button class="btn btn-sub" onclick="showHome()">🏠 ホームへ</button>
        </div>
      </div>
    </div>
  `;
}

function showQuizMessage(icon, title, desc) {
  const area = document.getElementById("quizCardArea");
  if (!area) return;
  area.innerHTML = `
    <div class="quiz-card">
      <div class="finish-view">
        <div class="finish-icon">${icon}</div>
        <div class="finish-title">${title}</div>
        <div class="finish-detail">${desc}</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="showQuizHome()">設定に戻る</button>
      </div>
    </div>
  `;
}

// ===== WRONG LIST =====
function showWrongList() {
  setNav("Wrong");
  const wrongIds = getWrongIds();
  const list = ALL_QUESTIONS.filter(q => wrongIds.includes(q.id));
  const h = getHistory();
  updateHeader(0, list.length);

  const items = list.map(q => {
    const qh = h[q.id];
    const attempts = qh ? qh.c + qh.w : 0;
    const rate = qh && attempts ? Math.round(qh.c / attempts * 100) : 0;
    return `<div class="list-card">
      <div class="lc-meta">
        <span class="pill">No.${q.id}</span>
        <span class="pill">${esc(q.chapter.replace(/（.*?）/g,""))}</span>
        ${q.spice ? `<span class="pill">${esc(q.spice)}</span>` : ""}
        ${qh ? `<span class="pill stale">過去${attempts}回 ${rate}%</span>` : ""}
      </div>
      <div class="lc-q">${esc(q.q)}</div>
      <div class="lc-a">答え：${esc(q.a)}</div>
      ${qh ? `<div class="lc-stat">最終挑戦: ${fmtDate(qh.last)} ／ 正解: ${qh.c}回 不正解: ${qh.w}回</div>` : ""}
      <div class="lc-actions">
        <button class="btn btn-sub" style="font-size:12px;padding:9px" onclick="removeWrong(${q.id})">削除</button>
        <button class="btn btn-primary" style="font-size:12px;padding:9px" onclick="singleQuiz(${q.id})">この問題を解く</button>
      </div>
    </div>`;
  }).join("");

  document.getElementById("appMain").innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="startWrongQuiz()" style="flex:1;font-size:13px;padding:11px">🔄 不正解を一括復習 (${list.length}問)</button>
      <button class="btn btn-sub" onclick="clearWrong()" style="font-size:13px;padding:11px">🗑 全削除</button>
    </div>
    ${list.length
      ? `<div>${items}</div>`
      : `<div class="empty"><div class="empty-icon">🌿</div><div class="empty-title">不正解なし</div><div class="empty-desc">苦手リストが空です！全問モードで解き進めましょう。</div></div>`
    }
  `;
}

function removeWrong(id) {
  setWrongIds(getWrongIds().filter(x => x !== id));
  showToast("削除しました");
  showWrongList();
}
function clearWrong() {
  if (confirm("不正解リストをすべて削除しますか？")) {
    setWrongIds([]);
    showWrongList();
  }
}
function startWrongQuiz() {
  state.mode = "wrong";
  state.chapter = "all";
  showQuizHome();
}
function singleQuiz(id) {
  const q = ALL_QUESTIONS.find(x => x.id === id);
  if (!q) return;
  setNav("Quiz");
  state.pool = [q];
  state.current = 0;
  state.correct = 0;
  state.wrong   = 0;
  document.getElementById("appMain").innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-sub" style="font-size:13px" onclick="showWrongList()">← 一覧へ</button>
      <button class="btn btn-sub" style="font-size:13px" onclick="removeWrong(${id})">リストから削除</button>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-text" id="progText">1 / 1</div>
    </div>
    <div id="quizCardArea"></div>
  `;
  renderQuestion();
}

// ===== PROFILES =====
function showProfiles(filter = "") {
  setNav("Profiles");
  const f    = filter.trim();
  const list = PROFILES.filter(p => !f || p.name.includes(f) || p.summary.join(" ").includes(f));
  updateHeader(0, PROFILES.length);

  document.getElementById("appMain").innerHTML = `
    <input class="search-input" placeholder="🔍 スパイス名・成分・効能で検索" value="${esc(f)}" oninput="showProfiles(this.value)" />
    <div>${list.map(p => `
      <div class="profile-card">
        <div class="profile-name">🌿 ${esc(p.name)}</div>
        ${p.summary.map(x => `<div class="profile-line">${esc(x)}</div>`).join("")}
      </div>
    `).join("")}</div>
    ${list.length === 0 ? `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-desc">「${esc(f)}」に一致する結果がありません</div></div>` : ""}
  `;
}

// ===== STATS / HISTORY =====
function showStats() {
  setNav("Stats");
  const h        = getHistory();
  const sessions = getSessions();
  const today    = new Date().toISOString().slice(0, 10);

  const answeredIds   = Object.keys(h);
  const todayCount    = answeredIds.filter(id => h[id].last?.slice(0,10) === today).length;
  const totalAnswered = answeredIds.length;
  const totalCorrect  = answeredIds.reduce((s, id) => s + h[id].c, 0);
  const totalWrong    = answeredIds.reduce((s, id) => s + h[id].w, 0);
  const totalAttempts = totalCorrect + totalWrong;
  const overallRate   = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;
  const streak        = getStreak();
  const wrongCount    = getWrongIds().length;
  const masteredCount = answeredIds.filter(id => {
    const qh = h[id];
    return qh && qh.c >= 3 && qh.c / (qh.c + qh.w) >= 0.8;
  }).length;

  // セッション履歴
  const sessionHTML = sessions.slice(0, 20).map(s => {
    const rate  = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const label = s.mode === "wrong" ? "不正解復習" : s.chapter === "all" ? "全問" : s.chapter.replace(/（.*?）/g,"");
    return `<div class="history-entry">
      <div class="he-icon">${rate >= 80 ? "🌟" : rate >= 60 ? "📖" : "💪"}</div>
      <div class="he-body">
        <div class="he-session">${esc(label)}</div>
        <div class="he-detail">${s.correct}正解 · ${s.wrong}不正解 · ${s.total}問 · ${fmtDate(s.date)}</div>
      </div>
      <div class="he-score ${rate >= 80 ? 'good' : rate >= 60 ? '' : 'bad'}">${rate}%</div>
    </div>`;
  }).join("") || `<div class="empty"><div class="empty-icon">📖</div><div class="empty-desc">まだ学習記録がありません</div></div>`;

  document.getElementById("appMain").innerHTML = `
    <div class="stat-section">
      <div class="section-title">📊 累計データ</div>
      <div class="stat-grid">
        <div class="stat-item"><div class="si-val">${totalAnswered}</div><div class="si-label">挑戦済み問題数</div></div>
        <div class="stat-item"><div class="si-val">${overallRate}%</div><div class="si-label">総合正解率</div></div>
        <div class="stat-item"><div class="si-val">${streak}日</div><div class="si-label">連続学習日数 🔥</div></div>
        <div class="stat-item"><div class="si-val">${masteredCount}</div><div class="si-label">習得済み問題数</div></div>
        <div class="stat-item"><div class="si-val">${todayCount}</div><div class="si-label">今日の学習数</div></div>
        <div class="stat-item"><div class="si-val">${wrongCount}</div><div class="si-label">不正解リスト数</div></div>
        <div class="stat-item"><div class="si-val">${totalCorrect}</div><div class="si-label">累計正解回数</div></div>
        <div class="stat-item"><div class="si-val">${totalAttempts}</div><div class="si-label">累計回答回数</div></div>
      </div>
    </div>

    <div class="stat-section">
      <div class="section-title">🕐 セッション履歴</div>
      ${sessionHTML}
    </div>

    <div style="margin-top:8px">
      <button class="btn btn-sub" style="width:100%;font-size:13px" onclick="showExport()">📋 不正解テキスト抜粋</button>
      <button class="btn btn-sub" style="width:100%;margin-top:8px;font-size:13px;color:var(--red)" onclick="resetAll()">⚠️ 全データ初期化</button>
    </div>
  `;
  updateHeader(0, ALL_QUESTIONS.length);
}

// ===== EXPORT =====
function showExport() {
  const wrongIds = getWrongIds();
  const list     = ALL_QUESTIONS.filter(q => wrongIds.includes(q.id));
  const h        = getHistory();
  const text     = list.map(q =>
    `No.${q.id} [${q.chapter}]\nQ. ${q.q}\nA. ${q.a}${q.spice ? "\n基本情報. " + (getProfile(q.spice)?.summary || []).join(" / ") : ""}`
  ).join("\n\n");

  document.getElementById("appMain").innerHTML = `
    <div class="section-title">📋 不正解テキスト抜粋 (${list.length}問)</div>
    <div class="card">
      <div style="font-size:14px;color:var(--muted);margin-bottom:8px">コピーしてメモ・LINE・Notionに貼れます</div>
      <textarea id="exportText">${esc(text || "不正解リストは空です。")}</textarea>
      <div class="btn-group" style="margin-top:12px">
        <button class="btn btn-primary" onclick="copyExport()">📋 コピーする</button>
        <button class="btn btn-sub" onclick="showStats()">← 記録へ戻る</button>
      </div>
    </div>
  `;
}
async function copyExport() {
  const t = document.getElementById("exportText");
  t.select();
  try { await navigator.clipboard.writeText(t.value); } catch { document.execCommand("copy"); }
  showToast("📋 コピーしました！");
}

// ===== RESET =====
function resetAll() {
  if (confirm("⚠️ 全ての学習記録・不正解リストを初期化しますか？この操作は元に戻せません。")) {
    [LS_WRONG, LS_HISTORY, LS_SESSIONS, LS_STREAK].forEach(k => localStorage.removeItem(k));
    state.mode = "all";
    state.chapter = "all";
    showToast("初期化しました");
    showHome();
  }
}

// ===== INIT =====
updateWrongBadge();
showHome();
